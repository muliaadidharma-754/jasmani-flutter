workflows:
  ios-appstore:
    name: iOS App Store (Jasmani 2026 Flutter)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      # Nama ini harus SAMA PERSIS dengan nama App Store Connect API key
      # yang kamu buat di Codemagic UI -> Teams -> Integrations -> App Store Connect.
      app_store_connect: codemagic_appstore_key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mulia754.jasmaniFlutter
      vars:
        # ID numerik app di App Store Connect (bukan bundle id), isi setelah
        # kamu membuat listing app-nya. Contoh: 6469xxxxxx
        APP_STORE_APPLE_ID: 0000000000

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing (App Store Connect otomatis)
        script: |
          xcode-project use-profiles

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Naikkan build number otomatis dari App Store Connect
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          echo "BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))" >> $CM_ENV

      - name: Build ipa untuk App Store
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Kabari lewat email tiap build selesai. Ganti dengan email kamu.
      email:
        recipients:
          - muliaadidharma@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        # Upload dulu ke TestFlight untuk dicoba sendiri lewat aplikasi
        # TestFlight di iPhone. Setelah yakin, baru submit_to_app_store
        # diubah jadi true untuk kirim ke App Review.
        submit_to_testflight: true
        submit_to_app_store: false

  android-playstore:
    name: Android Play Store (Jasmani 2026 Flutter)
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable
      groups:
        # Buat group "google_play" di Codemagic UI -> Environment variables,
        # isi dengan PACKAGE_NAME dan file service account JSON Play Console
        # kalau nanti mau auto-publish ke Play Console juga.
        - google_play
      vars:
        PACKAGE_NAME: "com.mulia754.jasmani_flutter"

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Build appbundle
        script: flutter build appbundle --release

    artifacts:
      - build/**/outputs/**/*.aab

    publishing:
      email:
        recipients:
          - muliaadidharma@gmail.com
        notify:
          success: true
          failure: true
